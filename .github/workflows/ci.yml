name: CI

on:
  pull_request:
  push:
    branches: [main, integracion]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      # PostgreSQL real para las pruebas de sincronizacion y permisos (schema `pos`).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POS_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # Python 3.11: es la version de despliegue (ultima compatible con Windows 8.1).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Pantalla virtual: las pruebas de la ventana unica (Tkinter) necesitan un display.
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Lint
        run: ruff check src tests
      - name: Pruebas (unitarias, integracion y PostgreSQL)
        run: xvfb-run -a pytest
