<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo navegable v2 — Punto de Venta e Inventario · Emporio NaturalSur</title>
<style>
:root{
  --ink:#1b2220; --ink2:#5a6560; --ink3:#8c958f;
  --line:#c8cecb; --line2:#e4e8e6; --fill:#f3f5f4; --paper:#fff;
  --brand:#2f6b45;
  --mc:#1D4E6F; --mcl:#E8F0F5;      /* color del módulo activo */
  --danger:#9d3b2f;
  --ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --num:"Consolas","SF Mono","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#cfd4d2;font-family:var(--ui);color:var(--ink);font-size:14px;line-height:1.45;padding:16px}

.win{max-width:1240px;margin:0 auto;background:var(--paper);border:1px solid #9aa29e;box-shadow:0 4px 0 rgba(0,0,0,.09)}

/* ---- barra de marca ---- */
.brand{display:flex;align-items:center;gap:10px;background:#20282a;color:#fff;padding:8px 14px}
.brand .mark{width:26px;height:26px;border-radius:5px;background:var(--brand);display:grid;place-items:center;font-size:15px}
.brand .nm{font-weight:600;letter-spacing:-.01em}
.brand .nm small{display:block;font-weight:400;font-size:10.5px;color:#9fb0a6;letter-spacing:.04em}
.brand .sp{flex:1}
.brand .chip{background:#2c3537;border:1px solid #3d474a;padding:3px 10px;font-size:12px;display:flex;gap:7px;align-items:center}
.brand .chip b{font-weight:600}

/* ---- pestañas de módulo ---- */
.tabs{display:flex;background:var(--fill);border-bottom:2px solid var(--mc);padding:0 6px;overflow-x:auto}
.tabs button{flex:0 0 auto;font-family:inherit;font-size:13.5px;background:transparent;border:none;border-top:3px solid transparent;
  padding:9px 15px 8px;cursor:pointer;color:var(--ink2);display:flex;align-items:center;gap:7px;white-space:nowrap}
.tabs button .fk{font-family:var(--num);font-size:10.5px;background:#dfe4e2;color:var(--ink2);padding:1px 4px;border-radius:2px}
.tabs button:hover{background:#e9edeb;color:var(--ink)}
.tabs button.on{background:var(--mc);color:#fff;font-weight:600}
.tabs button.on .fk{background:rgba(255,255,255,.22);color:#fff}
.tabs button:disabled{opacity:.42;cursor:not-allowed}

/* ---- franja de módulo ---- */
.banner{background:var(--mc);color:#fff;padding:7px 15px;display:flex;align-items:center;gap:12px}
.banner h1{margin:0;font-size:15.5px;font-weight:600;letter-spacing:.02em}
.banner .bsub{font-size:12.5px;color:rgba(255,255,255,.78);margin-left:auto}

/* ---- sub-navegación ---- */
.subnav{display:flex;gap:6px;background:var(--mcl);border-bottom:1px solid var(--line);padding:7px 12px;flex-wrap:wrap}
.subnav button{font-family:inherit;font-size:13px;padding:5px 13px;border:1px solid var(--line);background:#fff;cursor:pointer;border-radius:3px;color:var(--ink)}
.subnav button:hover{border-color:var(--mc)}
.subnav button.on{background:var(--mc);border-color:var(--mc);color:#fff;font-weight:600}

/* ---- botonera de acciones ---- */
.acts{display:flex;gap:6px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line2);background:#fafbfa}
button.act{font-family:inherit;font-size:12.8px;padding:5px 11px;border:1px solid var(--line);background:#fff;cursor:pointer;border-radius:3px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
button.act:hover{background:var(--mcl);border-color:var(--mc)}
button.act .fk{font-family:var(--num);font-size:10px;background:var(--fill);border:1px solid var(--line2);padding:0 3px;border-radius:2px;color:var(--ink2)}
button.act.pri{background:var(--mc);border-color:var(--mc);color:#fff;font-weight:600}
button.act.pri .fk{background:rgba(255,255,255,.2);border-color:transparent;color:#fff}
button.act.danger{border-color:#d9bdb8;color:var(--danger)}
button.act.danger:hover{background:#f8eceb;border-color:var(--danger)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--mc);outline-offset:1px}

.screen{padding:14px 15px 20px;min-height:430px}
.lead{color:var(--ink2);font-size:13px;margin:0 0 14px;max-width:80ch}

/* ---- campos ---- */
.codebar{display:flex;align-items:center;gap:10px;background:var(--mcl);border:1px solid var(--line);padding:10px 12px;margin-bottom:11px}
.codebar label{font-weight:600;font-size:13.5px;color:var(--mc);white-space:nowrap}
.codebar .inp{flex:1;border:2px solid var(--mc);background:#fff;padding:6px 10px;font-family:var(--num);font-size:15px;min-height:34px}
.codebar .hintk{font-size:11.5px;color:var(--ink2)}

.grid{display:grid;gap:10px 15px;margin-bottom:13px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.fld label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:3px}
.fld .box{border:1px solid var(--line);padding:5px 8px;background:#fff;min-height:29px;font-size:13.2px}
.fld .box.ro{background:var(--fill);color:var(--ink2)}
.fld .box.calc{background:#edf5ef;border-color:#b9d4c1;font-family:var(--num);color:#1f5333}
.fld .box.sel::after{content:"▾";float:right;color:var(--ink3)}
.fld .hint{font-size:11px;color:var(--ink3);margin-top:3px}

table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12.8px;background:#fff}
caption{text-align:left;font-size:11.5px;color:var(--ink2);padding-bottom:4px}
th{text-align:left;background:var(--fill);border:1px solid var(--line);padding:5px 8px;font-weight:600;font-size:11.5px;color:var(--ink2)}
td{border:1px solid var(--line2);padding:5px 8px}
td.n{text-align:right;font-family:var(--num)}
tbody tr:nth-child(even) td{background:#fbfcfb}
tr.sel td{background:var(--mcl) !important;box-shadow:inset 3px 0 0 var(--mc)}
tr.alert td{background:#fdf3ec !important}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-top:3px solid var(--mc);padding:9px 11px;background:#fff}
.kpi .l{font-size:11.5px;color:var(--ink2)}
.kpi .v{font-size:21px;font-family:var(--num);margin:2px 0}
.kpi .s{font-size:11.5px;color:var(--ink3)}

.panel{border:1px solid var(--line);margin-bottom:13px;background:#fff}
.panel>h3{margin:0;font-size:12.5px;padding:6px 10px;background:var(--fill);border-bottom:1px solid var(--line);font-weight:600;color:var(--ink2)}
.panel>div{padding:10px}

.note{border-left:3px solid var(--brand);background:#eef4f0;padding:8px 11px;font-size:12.5px;margin-bottom:13px;color:#24503a}
.warn{border-left:3px solid #b07a20;background:#fbf3e3;padding:8px 11px;font-size:12.5px;margin-bottom:13px;color:#6d4a11}

.hu{display:none;font-family:var(--num);font-size:10px;background:#eef4f0;border:1px solid #bfd6c8;color:#2c6244;padding:0 4px;border-radius:2px;margin-left:5px;vertical-align:1px}
body.ann .hu{display:inline-block}

/* ---- barra inferior de venta ---- */
.paybar{display:flex;align-items:stretch;border-top:2px solid var(--mc);background:var(--mcl)}
.paybar .cnt{padding:11px 15px;display:flex;align-items:center;gap:9px;border-right:1px solid var(--line)}
.paybar .cnt b{font-size:22px;font-family:var(--num);color:var(--mc)}
.paybar .figs{display:flex;gap:22px;padding:11px 15px;align-items:center;flex:1}
.paybar .fig .l{font-size:11px;color:var(--ink2)}
.paybar .fig .v{font-family:var(--num);font-size:15px}
.paybar .cobrar{display:flex;align-items:center;padding:9px 12px}
.paybar .tot{background:var(--mc);color:#fff;padding:9px 22px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;min-width:190px}
.paybar .tot .l{font-size:11px;color:rgba(255,255,255,.75)}
.paybar .tot .v{font-family:var(--num);font-size:27px;font-weight:600;line-height:1.1}

.status{border-top:1px solid var(--line);background:var(--fill);padding:5px 14px;font-size:11.5px;color:var(--ink2);display:flex;gap:16px;align-items:center}
.status .sp{flex:1}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin-right:5px}
.dot.off{background:#b07a20}

/* ---- diálogos, al estilo del sistema actual ---- */
.ov{position:fixed;inset:0;background:rgba(25,30,28,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
.ov.on{display:flex}
.modal{background:#fff;border:2px solid var(--mc);box-shadow:0 10px 30px rgba(0,0,0,.28);width:min(920px,100%);max-height:88vh;overflow-y:auto;overflow-x:hidden}
.modal>header{background:var(--mc);color:#fff;padding:7px 12px;font-weight:600;font-size:13.5px;display:flex;align-items:center}
.modal>header .x{margin-left:auto;cursor:pointer;width:22px;height:22px;line-height:19px;text-align:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)}
.modal .sub{background:var(--mcl);border-bottom:1px solid var(--line);padding:6px 12px;font-size:12px;color:var(--ink2)}
.modal .content{padding:13px;overflow-x:hidden}
.modal>footer{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;background:#fafbfa}

/* ---- pestañas de ticket ---- */
.tickets{display:flex;gap:3px;align-items:flex-end;margin-bottom:9px;border-bottom:1px solid var(--line)}
.tickets button{font-family:inherit;font-size:12.5px;padding:5px 14px;border:1px solid var(--line);border-bottom:none;
  background:var(--fill);cursor:pointer;color:var(--ink2);border-radius:3px 3px 0 0;margin-bottom:-1px}
.tickets button.on{background:#fff;color:var(--mc);font-weight:600;border-color:var(--line);border-bottom:1px solid #fff}
.tickets button.add{border-style:dashed;color:var(--mc)}

/* ---- selector de medio de pago ---- */
.pays{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:13px}
.pay{border:1px solid var(--line);background:#fff;padding:11px 8px;text-align:center;cursor:pointer;border-radius:3px}
.pay:hover{border-color:var(--mc);background:var(--mcl)}
.pay.on{border:2px solid var(--mc);background:var(--mcl)}
.pay .ic{font-size:23px;line-height:1.1}
.pay .nm{font-size:12.5px;font-weight:600;margin-top:3px}
.pay .ds{font-size:10.5px;color:var(--ink3)}

/* ---- total grande del diálogo de cobro ---- */
.bigtot{text-align:center;padding:9px 0 13px}
.bigtot .l{font-size:12.5px;color:var(--ink2)}
.bigtot .v{font-family:var(--num);font-size:40px;font-weight:600;color:var(--mc);line-height:1.1}

/* ---- columna de acciones tipo sistema actual ---- */
.withside{display:grid;grid-template-columns:minmax(0,1fr) 212px;gap:12px;align-items:start}
.withside>div{min-width:0}
@media (max-width:760px){.withside{grid-template-columns:1fr}}
.sidebox{background:var(--fill);border:1px solid var(--line);padding:9px}
.sidebox h4{margin:0 0 7px;font-size:10.5px;color:var(--ink2);font-weight:600;letter-spacing:.05em}
.sidebox button.act{width:100%;justify-content:flex-start;margin-bottom:6px;text-align:left;white-space:normal;line-height:1.3}
.sidebox .tot{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.sidebox .tot b{display:block;font-family:var(--num);font-size:19px;color:var(--ink)}

/* ---- billetes y monedas ---- */
.cash{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:10px}
@media (max-width:620px){.cash{grid-template-columns:repeat(3,minmax(0,1fr))}}
.den{border:1px solid var(--line);background:#fff;padding:7px;text-align:center;border-radius:3px}
.den .bill{height:34px;border-radius:3px;display:grid;place-items:center;font-family:var(--num);font-size:11.5px;
  color:#3a3020;font-weight:600;border:1px solid rgba(0,0,0,.18)}
.den .coin{height:34px;width:34px;border-radius:50%;margin:0 auto;display:grid;place-items:center;
  font-family:var(--num);font-size:11px;color:#4a3a1c;font-weight:600;border:2px solid rgba(0,0,0,.2)}
.den .cnt{margin-top:5px;border:1px solid var(--line);background:#fff;font-family:var(--num);font-size:14px;padding:2px}
.den .sub{font-size:10.5px;color:var(--ink3);margin-top:2px;font-family:var(--num)}
.b1000{background:#9cc47f}.b2000{background:#b3a2d0}.b5000{background:#e0959f}
.b10000{background:#93b3d9}.b20000{background:#e8ad7e}
.c500{background:#c9a86a}.c100{background:#d4be86}.c50{background:#c69a55}.c10{background:#c98f5e}

.stepper{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:5px}
.stepper button{width:24px;height:24px;padding:0;font-size:15px;line-height:1;border:1px solid var(--line);
  background:#fff;cursor:pointer;border-radius:3px;font-family:inherit}
.stepper button:hover{background:var(--mcl);border-color:var(--mc)}
.stepper .cnt{min-width:30px;text-align:center;font-family:var(--num);font-size:15px;
  border:1px solid var(--line);background:#fff;padding:1px 4px}
.den.has{border-color:var(--mc);background:var(--mcl)}
button.act.on{background:var(--mc);border-color:var(--mc);color:#fff}
button.act.on .fk{background:rgba(255,255,255,.22);border-color:transparent;color:#fff}
.payinfo{border:1px solid var(--line);background:#fafbfa;padding:11px;margin-bottom:11px}

/* ---- barra del prototipo ---- */
.proto{max-width:1240px;margin:0 auto 11px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:#3b433f}
.proto .tag,.proto label{background:#fff;border:1px solid #a4aca8;padding:3px 9px;display:flex;align-items:center;gap:6px}
.proto label{cursor:pointer}
.proto select{font-family:inherit;font-size:12.5px;border:1px solid #a4aca8;padding:2px 4px;background:#fff}
.proto .tag.link{cursor:pointer}

/* ---- mapa ---- */
.maprap{overflow-x:auto;border:1px solid var(--line);background:#fbfcfb;padding:10px}
svg .nd rect{fill:#fff;stroke:var(--line)}
svg .nd:hover rect{fill:var(--mcl);stroke:var(--mc)}
svg .nd text{font-family:var(--ui);font-size:11.5px;fill:var(--ink)}
svg .nd{cursor:pointer}
svg .edge{stroke:var(--line);stroke-width:1.2;fill:none}
svg .glabel{font-family:var(--ui);font-size:10.5px;fill:var(--ink3)}

@media (max-width:860px){.g2,.g3,.g4,.cards{grid-template-columns:1fr 1fr}.paybar{flex-wrap:wrap}}
@media (prefers-reduced-motion:no-preference){.screen{animation:f .13s ease-out}@keyframes f{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body>

<div class="proto">
  <span class="tag"><b>Prototipo navegable v2</b> · Emporio NaturalSur</span>
  <label><input type="checkbox" id="annChk"> Mostrar trazabilidad</label>
  <label>Perfil <select id="roleSel"><option value="admin">Administradora</option><option value="vend">Vendedora</option></select></label>
  <label><input type="checkbox" id="offChk"> Simular sin conexión</label>
  <span class="tag link" id="mapBtn">Mapa de navegación</span>
  <span class="tag link" id="cmpBtn">Comparar con el sistema actual</span>
</div>

<div class="win" id="win">
  <div class="brand">
    <div class="mark">◕</div>
    <div class="nm">NaturalSur<small>PUNTO DE VENTA E INVENTARIO</small></div>
    <div class="sp"></div>
    <div class="chip">Le atiende: <b id="whoami">Roxana Cifuentes</b> · <span id="whorole">Administradora</span></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="banner"><h1 id="bTitle"></h1><span class="bsub" id="bSub"></span></div>
  <div class="subnav" id="subnav"></div>
  <div id="actsWrap"></div>
  <div class="screen" id="screen"></div>
  <div id="payWrap"></div>

  <div class="status">
    <span id="stSync"><span class="dot"></span>Sincronizado</span>
    <span id="stCaja">Jornada abierta · fondo $15.000</span>
    <span class="sp"></span>
    <span>Prototipo · no es el sistema construido</span>
    <span id="stClock">15-sep-2026 09:50</span>
  </div>
</div>

<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true">
  <header><span id="mTitle"></span><span class="x" id="mX" role="button" tabindex="0" aria-label="Cerrar">×</span></header>
  <div class="sub" id="mSub"></div>
  <div class="content" id="mBody"></div>
  <footer><div id="mLeft"></div><div id="mFoot" style="display:flex;gap:8px"></div></footer>
</div></div>

<script>
/* ===================== helpers ===================== */
const E=s=>String(s==null?"":s);
const hu=id=>id?`<span class="hu">${id}</span>`:"";
const A=(l,o={})=>`<button class="act ${o.pri?'pri':''} ${o.danger?'danger':''}" ${o.go?`data-go="${o.go}"`:''} ${o.modal?`data-modal="${o.modal}"`:''} ${o.act?`data-act="1"`:''}>${o.fk?`<span class="fk">${o.fk}</span>`:''}${l}</button>`;
const acts=arr=>`<div class="acts">${arr.map(b=>A(b.l,b)).join("")}</div>`;
const fld=(l,v,o={})=>`<div class="fld"><label>${l}${hu(o.hu)}</label><div class="box ${o.ro?'ro':''} ${o.calc?'calc':''} ${o.sel?'sel':''}">${E(v)||'&nbsp;'}</div>${o.hint?`<div class="hint">${o.hint}</div>`:''}</div>`;
const G=(n,it)=>`<div class="grid g${n}">${it.join("")}</div>`;
const T=(cols,rows,o={})=>`<table>${o.cap?`<caption>${o.cap}${hu(o.hu)}</caption>`:''}<thead><tr>${cols.map(c=>`<th${c.n?' style="text-align:right"':''}>${c.t||c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr class="${r.cls||''}">${r.c.map((v,i)=>`<td class="${cols[i]&&cols[i].n?'n':''}">${E(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
const K=arr=>`<div class="cards">${arr.map(k=>`<div class="kpi"><div class="l">${k.l}${hu(k.hu)}</div><div class="v">${k.v}</div><div class="s">${k.s||''}</div></div>`).join("")}</div>`;
const P=(t,c,h)=>`<div class="panel"><h3>${t}${hu(h)}</h3><div>${c}</div></div>`;
const note=t=>`<div class="note">${t}</div>`;
const warn=t=>`<div class="warn">${t}</div>`;
const DEN=[{v:20000,c:"bill b20000"},{v:10000,c:"bill b10000"},{v:5000,c:"bill b5000"},
 {v:2000,c:"bill b2000"},{v:1000,c:"bill b1000"},{v:500,c:"coin c500"},{v:100,c:"coin c100"},
 {v:50,c:"coin c50"},{v:10,c:"coin c10"}];
const $$=n=>"$"+n.toLocaleString("es-CL");
const CASH_ST={pago:{20000:1,10000:2},conteo:{20000:4,10000:2,5000:1,1000:1,100:4}};
const cashTot=k=>DEN.reduce((a,d)=>a+d.v*(CASH_ST[k][d.v]||0),0);
const CASH=k=>`<div class="cash">${DEN.map(d=>{const n=CASH_ST[k][d.v]||0;
 return `<div class="den ${n?'has':''}"><div class="${d.c}">${d.v>=1000?(d.v/1000)+"mil":d.v}</div>
 <div class="stepper"><button data-den="${d.v}" data-kind="${k}" data-op="-1" aria-label="Quitar">−</button>
 <span class="cnt">${n}</span>
 <button data-den="${d.v}" data-kind="${k}" data-op="1" aria-label="Agregar">+</button></div>
 <div class="sub">${n?$$(d.v*n):"—"}</div></div>`}).join("")}</div>`;
const PAY={medio:"efectivo"};
const MEDIOS=[["efectivo","◉","Efectivo","redondea a la decena"],["tarjeta","▭","Tarjeta","terminal TUU"],
 ["transferencia","⇄","Transferencia","medio propio"],["credito","☺","Crédito de cliente","a una cuenta"]];
const code=(o={})=>`<div class="codebar"><label>${o.l||'Código del producto:'}</label><div class="inp">│</div><span class="hintk">${o.h||'El cursor queda acá al abrir. El lector escribe solo y agrega con Enter.'}</span></div>`;

/* ===================== módulos ===================== */
const MOD = {
 op :{fk:"F1", l:"Operación",      c:"#1D4E6F", cl:"#E8F0F5"},
 cat:{fk:"F2", l:"Catálogo",       c:"#8A5A17", cl:"#F7F0E3"},
 inv:{fk:"F3", l:"Inventario",     c:"#5B3E7E", cl:"#F0EBF6"},
 cli:{fk:"F4", l:"Clientes",       c:"#2E6B3E", cl:"#E9F2EA"},
 com:{fk:"F5", l:"Compras",        c:"#7A4A2E", cl:"#F5EEE9"},
 rep:{fk:"F6", l:"Reportes",       c:"#1E5F63", cl:"#E7F1F1"},
 adm:{fk:"F7", l:"Administración", c:"#4A4F55", cl:"#EEEFF0"}
};
const SUB = {
 op :[["venta","Venta"],["caja","Caja y corte"],["panel","Resumen del día"]],
 cat:[["productos","Productos"],["categorias","Categorías"]],
 inv:[["existencias","Existencias"],["lotes","Lotes y vencimientos"],["alertas","Alertas"]],
 cli:[["clientes","Clientes"],["cliente-cuenta","Cuenta"],["estado-cuenta","Estado de cuenta"]],

 cobro:{t:"Venta de productos: cobrar",s:"Ticket 3 · 3 productos",b:()=>{
  const TOT=33670, pagado=cashTot("pago"), vuelto=pagado-TOT;
  const sel=MEDIOS.map(([id,ic,nm,ds])=>`<div class="pay ${PAY.medio===id?'on':''}" data-pay="${id}" role="button" tabindex="0"><div class="ic">${ic}</div><div class="nm">${nm}</div><div class="ds">${ds}</div></div>`).join("");
  let cuerpo="";
  if(PAY.medio==="efectivo"){
    cuerpo=`<div style="font-size:12px;color:var(--ink2);margin-bottom:6px">Billetes y monedas que entrega el cliente${hu("HU-VTA-04")}</div>`
      + CASH("pago")
      + G(3,[fld("Pagó con",$$(pagado),{calc:1,hint:"Suma de lo ingresado arriba"}),
             fld("Total a cobrar",$$(TOT),{ro:1}),
             fld("Su cambio", vuelto>=0?$$(vuelto):"falta "+$$(-vuelto), {calc:1})])
      + (vuelto<0?warn("Lo ingresado no alcanza a cubrir el total. La venta no se puede cerrar hasta que lo cubra."):"")
      + note("<b>Por qué se ingresan los billetes.</b> Al registrar con qué se pagó, la gaveta queda cuadrada por denominación y el cambio se calcula solo. Es también lo que permite contar la caja después sin adivinar cómo se compuso.");
  } else if(PAY.medio==="tarjeta"){
    cuerpo=`<div class="payinfo">${G(2,[fld("Monto a cobrar en tarjeta",$$(TOT),{ro:1}),fld("Comprobante del terminal","",{hint:"Opcional: número que imprime el TUU"})])}</div>`
      + warn("<b>Tarjeta es un solo medio.</b> El terminal TUU solo pide seleccionar «tarjeta», sin distinguir débito de crédito, así que el sistema registra un único total. El desglose lo entrega el propio terminal en su cierre, y la conciliación compara ambos totales.")
      + note("El monto se digita en el terminal aparte, igual que hoy. La integración con el terminal está fuera del alcance del proyecto.");
  } else if(PAY.medio==="transferencia"){
    cuerpo=`<div class="payinfo">${G(2,[fld("Monto transferido",$$(TOT),{ro:1}),fld("Referencia","",{hint:"Opcional"})])}</div>`
      + warn("Hoy la transferencia se registra como efectivo y se corrige a mano en una libreta. Acá es un medio propio y el corte cuadra sin corrección.");
  } else {
    cuerpo=`<div class="payinfo">${G(3,[fld("Cliente","Cliente A",{sel:1,hu:"HU-CLI-02"}),fld("Saldo actual","$47.310",{ro:1}),fld("Saldo resultante",$$(47310+TOT),{calc:1})])}</div>`
      + note("La venta queda cargada a la cuenta del cliente y aparece en el corte de la jornada dentro del total vendido, como partida propia. Es exactamente lo que hoy no hace el sistema y obliga a explicar la diferencia cada día.");
  }
  return `<div class="withside"><div>
    <div class="bigtot"><div class="l">Total a cobrar</div><div class="v">${$$(TOT)}</div></div>
    <div class="pays">${sel}</div>
    ${cuerpo}
   </div>
   <div class="sidebox"><h4>ACCIONES</h4>
     ${A("Cobrar e imprimir ticket",{fk:"F1",pri:1,act:1})}
     ${A("Cobrar solo registrando la venta",{fk:"F2",act:1})}
     ${A("Ingresar notas",{fk:"F4",modal:"nota"})}
     ${A("Cancelar",{fk:"ESC",act:1})}
     <div class="tot">Total de artículos<b>3</b></div>
   </div></div>`
  + note("<b>Cobrar e imprimir</b> genera el comprobante de detalle, que no tiene validez tributaria: la boleta la emite el terminal. <b>Cobrar solo registrando la venta</b> la deja anotada sin imprimir, para cuando el cliente no pide el detalle.");
 },
  l:[],f:[]},

 conteo:{t:"Conteo de la gaveta",s:"Cuente el efectivo por denominación",b:()=>{
  const esp=106400, tot=cashTot("conteo"), dif=tot-esp;
  return CASH("conteo")
   + G(3,[fld("Total contado",$$(tot),{calc:1}),fld("Efectivo esperado",$$(esp),{ro:1}),
          fld("Diferencia",(dif===0?"$0":(dif>0?"sobran ":"faltan ")+$$(Math.abs(dif))),{calc:1})])
   + (dif!==0?warn("Hay diferencia contra el efectivo esperado. Antes de cerrar conviene revisar si faltó registrar un retiro, un depósito o una venta en efectivo."):
              note("La gaveta cuadra con lo esperado."))
   + note("<b>Por qué contar por denominación.</b> Hoy el arqueo es un número suelto: si aparece una diferencia no hay cómo saber dónde se produjo. Registrando con qué está compuesta la caja, la revisión es posible.")
   + warn("<b>Requisito nuevo, sin validar.</b> El conteo por denominación y el registro de retiros y depósitos no salieron de las entrevistas. Requieren validación de la Product Owner y una historia propia.");
 },
  l:[{l:"Registrar retiro",modal:"movcaja"},{l:"Registrar depósito",modal:"movcaja"}],
  f:[{l:"Cancelar",fk:"ESC",act:1},{l:"Guardar conteo",fk:"ENTER",pri:1,act:1}]},

  + G(2,[fld("Lote","L-2620",{hu:"HU-INV-02",hint:"Solo si el producto es perecible"}),
         fld("Vence el","04-11-2026",{hu:"HU-INV-02"})])
  + note("<b>Para qué sirve.</b> Una factura trae varios productos, y cada uno es una línea con su cantidad y su costo unitario. La suma de las líneas tiene que cuadrar con el monto neto de la factura antes de poder confirmarla.")
  + note("Al confirmar la factura completa, cada línea hace dos cosas: suma la cantidad al inventario y actualiza el costo del producto. Este producto no tenía costo cargado y esta línea se lo da: deja de reportar 100% de ganancia."),
  l:[],f:[{l:"Cancelar",fk:"ESC",act:1},{l:"Agregar línea",fk:"ENTER",pri:1,act:1}]},

 enviado:{t:"Marcar el estado de cuenta como enviado",s:"Cliente A · ciclo de septiembre 2026",b:
  G(3,[fld("Enviado el","15-09-2026",{ro:1}),fld("Por","Roxana Cifuentes",{ro:1}),
       fld("Medio","WhatsApp",{sel:1,hint:"WhatsApp · Correo · Entregado en persona"})])
  + G(1,[fld("Observación","")])
  + note("<b>Para qué sirve.</b> Deja registrado que a este cliente ya se le mandó el detalle del mes. Así no se envía dos veces ni se olvida a alguien: el listado de clientes muestra cuáles del ciclo quedan pendientes de enviar.")
  + warn("Es un agregado del prototipo, no salió de las entrevistas. Hoy el envío se lleva de memoria. Si a las propietarias les parece innecesario, se retira sin afectar el resto."),
  l:[],f:[{l:"Cancelar",fk:"ESC",act:1},{l:"Marcar como enviado",fk:"ENTER",pri:1,act:1}]},

 meta:{t:"Meta diaria de ganancia",s:"Sobre ganancia, no sobre monto vendido",b:
  T([{t:"Tipo de día"},{t:"Meta de ganancia",n:1},{t:"Vigente desde"}],[
    {c:["Lunes a viernes","$85.000","01-09-2026"]},{c:["Sábado","$95.000","01-09-2026"]},
    {c:["Domingo y festivos","$35.000","01-09-2026"]}],{hu:"HU-REP-05"})
  + G(3,[fld("Bajo el 85%","Rojo",{ro:1}),fld("Entre 85% y 100%","Amarillo",{ro:1}),fld("Sobre el 100%","Verde",{ro:1})])
  + warn("Los valores son de ejemplo. Las metas reales salen del Excel de punto de equilibrio de la Product Owner, que todavía no ha sido entregado.")
  + note("Cambiar una meta no altera el cumplimiento ya calculado de jornadas anteriores: cada meta guarda su fecha de vigencia."),
  l:[],f:[{l:"Cancelar",fk:"ESC",act:1},{l:"Guardar metas",fk:"ENTER",pri:1,act:1}]}
};

/* ===================== estado y render ===================== */
let cur="venta", role="admin", logged=false;
const $=s=>document.querySelector(s);

function setColor(m){const d=MOD[m]||MOD.op;document.documentElement.style.setProperty('--mc',d.c);document.documentElement.style.setProperty('--mcl',d.cl);}

function drawTabs(){
  $("#tabs").innerHTML=Object.entries(MOD).map(([id,m])=>{
    const first=SUB[id][0][0];
    const blocked=role==="vend"&&!SUB[id].some(([s])=>VEND_OK.includes(s));
    const on=S[cur]&&S[cur].mod===id;
    return `<button data-tab="${id}" class="${on?'on':''}" ${blocked?'disabled':''} title="${m.l}"><span class="fk">${m.fk}</span>${m.l}</button>`;
  }).join("");
}

function drawSub(){
  const m=S[cur].mod, list=SUB[m]||[];
  const extra = (cur==="mapa"||cur==="comparar") ? [[cur, S[cur].t.charAt(0)+S[cur].t.slice(1).toLowerCase()]] : [];
  $("#subnav").innerHTML=[...list,...extra].map(([id,l])=>{
    const blocked=role==="vend"&&!VEND_OK.includes(id);
    return `<button data-go="${id}" class="${cur===id?'on':''}" ${blocked?'disabled':''}>${l}</button>`;
  }).join("");
}

function go(id){
  if(!S[id])return;
  if(role==="vend"&&!VEND_OK.includes(id)){
    setColor("op");
    $("#bTitle").textContent="ACCESO RESTRINGIDO"; $("#bSub").textContent="";
    $("#actsWrap").innerHTML=acts([{l:"Volver a la venta",fk:"F1",pri:1,go:"venta"}]);
    $("#screen").innerHTML=warn("El perfil de <b>vendedora</b> no tiene acceso a esta sección. Pídele a una administradora que la abra.")
      + note("Así se comporta el control de acceso por perfil. La restricción se aplica en la aplicación y también en la base de datos, no solo ocultando el botón.");
    $("#payWrap").innerHTML=""; $("#subnav").innerHTML=""; drawTabs(); return;
  }
  cur=id; const s=S[id];
  setColor(s.mod);
  $("#bTitle").textContent=s.t;
  $("#bSub").textContent=s.sub||"";
  drawTabs(); drawSub();
  $("#actsWrap").innerHTML=s.acts?acts(s.acts):"";
  $("#screen").innerHTML=s.body;
  $("#payWrap").innerHTML=s.pay?`<div class="paybar">
      <div class="cnt"><b>${s.pay.n}</b> productos en la venta actual</div>
      <div class="figs">
        <div class="fig"><div class="l">Total</div><div class="v">${s.pay.total}</div></div>
        <div class="fig"><div class="l">Pagó con</div><div class="v">${s.pay.pago}</div></div>
        <div class="fig"><div class="l">Cambio</div><div class="v">${s.pay.cambio}</div></div>
      </div>
      <div class="cobrar">${A("Cobrar",{fk:"F12",pri:1,modal:"cobro"})}</div>
      <div class="tot"><div class="l">Total a cobrar</div><div class="v">${s.pay.total}</div></div>
    </div>`:"";
  window.scrollTo({top:0,behavior:"instant"});
}

let curModal=null;
function openM(k){
  const m=M[k]; if(!m)return;
  curModal=k;
  $("#mTitle").textContent=m.t; $("#mSub").textContent=m.s||"";
  $("#mSub").style.display=m.s?"block":"none";
  $("#mBody").innerHTML=(typeof m.b==="function")?m.b():m.b;
  $("#mLeft").innerHTML=(m.l||[]).map(b=>A(b.l,b)).join("");
  $("#mFoot").innerHTML=m.f.map(b=>A(b.l,b)).join("");
  $("#ov").classList.add("on");
}
function closeM(){
  $("#ov").classList.remove("on"); curModal=null;
  document.querySelectorAll("#actsWrap button.act.on").forEach(b=>b.classList.remove("on"));
}

/* ---- login ---- */
function showLogin(){
  logged=false; setColor("op");
  $("#tabs").innerHTML=""; $("#subnav").innerHTML=""; $("#actsWrap").innerHTML=""; $("#payWrap").innerHTML="";
  $("#bTitle").textContent="INICIAR SESIÓN"; $("#bSub").textContent="";
  $("#screen").innerHTML=`<div style="max-width:400px;margin:36px auto">
    ${G(1,[fld("Usuario","roxana",{hu:"HU-USR-01"}),fld("Contraseña","••••••••")])}
    ${acts([{l:"Entrar",fk:"ENTER",pri:1,act:1,go:"venta"}])}
    ${note("Hoy el sistema entra directo como «Administrador de la Tienda», sin pedir nada. Cada persona tendrá su usuario, y cada venta y cada cambio de precio quedará asociado a quien lo hizo.")}
    ${warn("Si las credenciales no coinciden, el mensaje dice «usuario o contraseña incorrectos» sin precisar cuál de los dos falló.")}</div>`;
}
S.login={mod:"op",t:"INICIAR SESIÓN",sub:"",body:""};

/* ---- eventos ---- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");
  if(t&&!t.disabled){ closeM(); go(SUB[t.getAttribute("data-tab")][0][0]); return; }
  const g=e.target.closest("[data-go]");
  if(g&&!g.disabled){ closeM(); logged=true; go(g.getAttribute("data-go")); return; }
  const dn=e.target.closest("[data-den]");
  if(dn){
    const k=dn.getAttribute("data-kind"), v=+dn.getAttribute("data-den"), op=+dn.getAttribute("data-op");
    CASH_ST[k][v]=Math.max(0,(CASH_ST[k][v]||0)+op);
    if(curModal) $("#mBody").innerHTML=(typeof M[curModal].b==="function")?M[curModal].b():M[curModal].b;
    return;
  }
  const pz=e.target.closest("[data-pay]");
  if(pz){
    PAY.medio=pz.getAttribute("data-pay");
    if(curModal) $("#mBody").innerHTML=M[curModal].b();
    return;
  }
  const m=e.target.closest("[data-modal]");
  if(m){
    if(m.classList.contains("act")){
      document.querySelectorAll("#actsWrap button.act.on").forEach(b=>b.classList.remove("on"));
      if(m.closest("#actsWrap")) m.classList.add("on");
    }
    openM(m.getAttribute("data-modal")); return; }
  if(e.target.closest("[data-act]")){ closeM(); return; }
  if(e.target.id==="mX"||e.target.id==="ov") closeM();
  if(e.target.id==="mapBtn"){ closeM(); go("mapa"); }
  if(e.target.id==="cmpBtn"){ closeM(); go("comparar"); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeM();return}
  if(!logged) return;
  const fk={F1:"op",F2:"cat",F3:"inv",F4:"cli",F5:"com",F6:"rep",F7:"adm"}[e.key];
  if(fk){ e.preventDefault(); const first=SUB[fk][0][0];
    if(!(role==="vend"&&!VEND_OK.includes(first))){ closeM(); go(first);} return; }
  if(e.key==="F10"&&cur==="venta"){e.preventDefault();openM("buscar")}
});
$("#annChk").addEventListener("change",e=>document.body.classList.toggle("ann",e.target.checked));
$("#offChk").addEventListener("change",e=>{
  $("#stSync").innerHTML=e.target.checked
    ?`<span class="dot off"></span>Sin conexión · 4 operaciones pendientes de enviar`
    :`<span class="dot"></span>Sincronizado`;});
$("#roleSel").addEventListener("change",e=>{
  role=e.target.value;
  $("#whoami").textContent=role==="admin"?"Roxana Cifuentes":"Turno de mostrador";
  $("#whorole").textContent=role==="admin"?"Administradora":"Vendedora";
  if(role==="vend"&&!VEND_OK.includes(cur)) go("venta"); else go(cur);});

showLogin();
</script>
</body>
</html>
